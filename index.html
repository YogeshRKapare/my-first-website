<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arij's Store</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #232f3e;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .hero-text {
            max-width: 50%;
        }

        .hero-text h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .hero-text p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .hero img {
            max-width: 40%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #232f3e;
            color: white;
            margin-top: 2rem;
        }

        footer p {
            font-size: 0.9rem;
        }

        footer a {
            color: #ff9900;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Arij's Store</h1>
    </header>

    <div class="container">
        <div class="hero">
            <div class="hero-text">
                <h2>Discover Amazing Products</h2>
                <p>Shop the best deals and explore a wide range of items tailored just for you. Your journey to amazing finds starts here!</p>
            </div>
            <img src="images/Screenshot 2025-09-27 115129.png" alt="Sample Product">
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Arij's Store. All rights reserved. | <a href="#">Privacy Policy</a></p>
    </footer>
</body>
</html>
